<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qelvoryn - ブラウザテスト</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #14161c; color: #e6e8ee;
    font: 14px/1.55 "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #9aa3b5; font-size: 13px; }
  #summary {
    display: flex; gap: 16px; align-items: center;
    padding: 12px 16px; border: 1px solid #2c3140; border-radius: 10px;
    background: #1b1e26; margin-bottom: 16px;
  }
  #summary .big { font-size: 22px; font-weight: 700; }
  #summary .pass { color: #6fdc8c; }
  #summary .fail { color: #ff7a7a; }
  #summary .skip { color: #ffce6b; }
  #summary .grow { flex: 1; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li.test {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline;
    padding: 10px 14px; border: 1px solid #262b38; border-radius: 8px; background: #191c24;
  }
  li.test.running { border-color: #3b4459; }
  li.test.pass .icon { color: #6fdc8c; }
  li.test.fail { border-color: #5c2b2b; background: #201a1d; }
  li.test.fail .icon { color: #ff7a7a; }
  li.test.skip .icon { color: #ffce6b; }
  li.test .icon { font-weight: 700; text-align: center; }
  li.test .meta { color: #8b93a7; font-size: 12px; white-space: nowrap; }
  li.test .err {
    grid-column: 2 / 4; margin-top: 6px; padding: 8px 10px; border-radius: 6px;
    background: #2a1c1f; border: 1px solid #5c2b2b; color: #ffb3b3;
    font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }
  #rerun {
    margin-top: 18px; padding: 8px 16px; border-radius: 8px;
    border: 1px solid #3a4152; background: #222736; color: #e6e8ee; cursor: pointer; font: inherit;
  }
  #rerun:hover { background: #2a3042; }
  #rerun:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <h1>Qelvoryn - ブラウザ統合テスト</h1>
  <p class="sub">実際のブラウザ API で検証します: canvas 合成、WebAudio デコード、IndexedDB 保存、MediaRecorder 書き出し。ロジックテストは <code>tests/*.test.js</code> にあり <code>npm test</code> で実行します。</p>
  <div id="summary"><span class="big">…</span><span class="grow"></span></div>
  <ol id="tests"></ol>
  <button id="rerun" type="button">再実行</button>
  <script type="module">
    import { runBrowserTests } from './browser/tests.js';
    const btn = document.getElementById('rerun');
    const run = async () => {
      btn.disabled = true;
      await runBrowserTests({ summary: document.getElementById('summary'), list: document.getElementById('tests') });
      btn.disabled = false;
    };
    btn.addEventListener('click', run);
    run();
  </script>
</body>
</html>
