<!DOCTYPE html>

<head>

  <meta name="description" content="Qelvoryn はインストール不要・サーバー不要で動作するブラウザネイティブのノンリニア動画編集アプリです。マルチトラック編集、キーフレーム、エフェクト、音声ミックス、AI演出アシスト、動画書き出しまでをブラウザ内で完結します。" />
  <meta name="theme-color" content="#0d1117" />
  <meta property="og:title" content="Qelvoryn" />
  <meta property="og:description" content="ブラウザだけで完結するノンリニア動画編集。すべての処理は端末内で行われ、動画がアップロードされることはありません。" />

  <div id="boot" class="boot">
    <div class="boot-inner">
